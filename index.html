<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Task Manager</h1>
      <div class="student-info">
        <span>Student ID: </span>
        <strong id="student-id">78453</strong>
      </div>
    </header>

    <div class="navigation-bar">
      <a id="contribution-link" href="contribution.html">Team Contribution</a>
    </div>

    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>

    <main class="main-content">
      <section class="form-section">
        <h2 id="form-heading">Add New Task</h2>
        <form id="task-form">
          <input type="hidden" id="editing-task-id" value="">

          <div class="form-group">
            <label for="task-title">Title <span class="required">*</span></label>
            <input 
              type="text" 
              id="task-title" 
              name="title" 
              placeholder="e.g. Learn Git" 
              required
            >
          </div>

          <div class="form-group">
            <label for="task-description">Description</label>
            <textarea 
              id="task-description" 
              name="description" 
              rows="3" 
              placeholder="Optional description of the task..."
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="task-submit" class="btn btn-primary">Add Task</button>
            <button type="button" id="task-cancel" class="btn btn-secondary" style="display: none;">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="list-section">
        <div class="list-header">
          <h2>Task List</h2>
          <button id="refresh-tasks-btn" class="btn btn-small btn-secondary" type="button">Refresh</button>
        </div>
        <ul id="task-list" class="task-list">
          <!-- Tasks will be dynamically injected here -->
        </ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Course: Team Project – IT | Practical Assignment 1</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
